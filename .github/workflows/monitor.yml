name: Ageo free availability monitor
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'One detail batch only, no slot notifications'
        type: boolean
        default: true
      reprocess:
        description: 'Reprocess recent saved observations; do not access the reservation site'
        type: boolean
        default: false
  schedule:
    - cron: '0 0-14 * * *'
permissions:
  contents: write
concurrency:
  group: ageo-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
      CLOUD_BROWSER_APPROVED: ${{ vars.CLOUD_BROWSER_APPROVED }}
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      GITHUB_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SMOKE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke && 'true' || 'false' }}
      REPROCESS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.reprocess && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install fixed dependencies
        run: npm ci --ignore-scripts
      - name: Run offline verification
        run: npm test
      - name: Install Chromium
        if: vars.MONITOR_ENABLED == 'true' && vars.CLOUD_BROWSER_APPROVED == 'true' && !inputs.reprocess
        run: npx playwright install --with-deps chromium
      - name: Check availability and notify
        run: npm start
      - name: One-time production push confirmation
        if: github.event_name == 'workflow_dispatch' && !inputs.smoke && !inputs.reprocess
        run: |
          node --input-type=module <<'JS'
          import {GithubStore} from './github-store.mjs';
          import {notifier} from './push.mjs';
          import {notice} from './delivery.mjs';
          const e=process.env;
          if(new Date().toISOString().slice(0,10)!=='2026-10-25')process.exit(0);
          const store=await new GithubStore({repo:e.GITHUB_REPOSITORY,token:e.GITHUB_TOKEN,secret:e.STATE_KEY}).open();
          const state=await store.load();
          if(state.test0920?.accepted)process.exit(0);
          if(state.health?.status!=='healthy'||state.health.sourceMode!=='live'||Date.now()-Date.parse(state.health.observedAt)>600000)throw Error('FRESH_SUCCESS_REQUIRED');
          const push=notifier({topic:e.NTFY_TOPIC});
          const title='上尾バドミントン 自動検索テスト完了';
          const message='09:20予定の自動検索が完了しました。条件に合う空き'+state.health.candidateCount+'枠、新規'+state.health.newCount+'枠。予約はしていません。これは今回だけの本番通知テストです。';
          await notice({state,fingerprint:'production-test-20261025-0920',title,message,save:s=>store.save(s),push});
          const receipt=await push.find({title,message});
          if(!receipt?.id)throw Error('TEST_READBACK_NOT_CONFIRMED');
          state.test0920={accepted:true,receiptId:receipt.id,confirmedAt:new Date().toISOString()};await store.save(state);
          console.log(JSON.stringify({event:'production_test_confirmed',receiptId:receipt.id}));
          JS
