<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Safariで予約画面を開く</title>
<style>body{font:18px/1.7 system-ui;margin:0;background:#eff6f2;color:#183b29}main{max-width:32rem;margin:10vh auto;padding:24px}button{background:#07874c;color:white;border:0;border-radius:14px;padding:18px;width:100%;font-size:20px}small{display:block;margin-top:20px;color:#506257}#note{white-space:pre-line}</style>
<main><h1>Safariへ渡しています</h1><p id="note">起動リンクの試験です。</p><button id="open" hidden>Safariで開く</button><small>Braveのデフォルト設定は変更しません。予約は確定しません。</small></main>
<script>
'use strict';
const note=document.querySelector('#note'),button=document.querySelector('#open');
try{
 const data=JSON.parse(decodeURIComponent(location.hash.slice(1)));
 let url;
 if(data.test===true){url='https://example.org/';note.textContent='Safari起動だけの試験です。予約サイトにはアクセスしません。';}
 else{
  const halls=['原市公民館','平方公民館','上平公民館','大石公民館','大谷公民館'];
  if(data.v!==1||![...halls,'自動車精工 上尾市民体育館（市民体育館）'].includes(data.f)||!/^\d{4}-\d{2}-\d{2}$/.test(data.d)||!Number.isInteger(data.s)||!Number.isInteger(data.e)||data.s<9||data.e>22||data.s>=data.e)throw Error('通知の対象指定を確認できません。');
  if(halls.includes(data.f)?data.r!=='集会室兼体育室':!/^アリーナ\s*[１1][／/]\s*[２2][ＡＢAB]$/.test(data.r))throw Error('体育室の指定が正しくありません。');
  const time=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
  if(time<'08:30'||time>'23:50')throw Error('予約サイトの照会時間外です。08:30〜23:50に開いてください。');
  url='https://www.pf-yoyaku.com/User/ageo/Home#ageo-slot='+encodeURIComponent(JSON.stringify({v:1,f:data.f,r:data.r,d:data.d,s:data.s,e:data.e}));
  note.textContent=data.f+'\n'+data.d+' '+data.s+'〜'+data.e+'時';
 }
 const safari=url.replace(/^https:/,'x-safari-https:');
 function launch(){location.href=safari;}
 button.hidden=false;button.onclick=launch;
 setTimeout(()=>{document.querySelector('h1').textContent='Safariで予約画面を開く';},1500);
 launch();
}catch(e){document.querySelector('h1').textContent='自動で開けませんでした';note.textContent=e.message;}
</script></html>
